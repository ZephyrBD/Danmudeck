name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 页脚需要 git 短哈希

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd server
          bun install --frozen-lockfile --cwd client

      - name: Typecheck
        run: |
          bun run typecheck:client
          bun run typecheck:server

      - name: Test
        run: |
          bun run test:client
          bun run test:server

      - name: Bundle exe
        run: bun run bundle

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path danmudeck.exe)) { throw 'danmudeck.exe missing' }
          $size = (Get-Item danmudeck.exe).Length
          Write-Host "danmudeck.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "danmudeck.exe too small: $size bytes" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmudeck-windows
          path: danmudeck.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: danmudeck.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
